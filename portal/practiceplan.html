<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal — Practice Plan</title>
<link rel="icon" href="../img/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/portal.css">
<link rel="stylesheet" href="css/theme-practiceplan.css">
</head>
<body class="portal">
<div id="boot">Loading…</div>

<!-- Signed-out screens -->
<div id="auth" class="auth-wrap" hidden>
  <div class="auth-side">
    <img class="auth-logo" src="brand/practiceplan-logo.png" alt="Practice Plan" width="72" height="72" onerror="this.style.display='none'">
    <h1 id="auth-title">Your HIW inspection-readiness portal</h1>
    <p id="auth-sub">Dashboard, evidence, training and bookings in one secure place — in English and Welsh.</p>
  </div>
  <div class="auth-main"><div class="auth-card" id="auth-card"></div></div>
</div>

<!-- Signed-in app -->
<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand-row"><img src="brand/practiceplan-logo.png" alt="" width="34" height="34" onerror="this.style.display='none'"><span>Practice Plan</span></div>
    <nav id="side-nav" aria-label="Main"></nav>
    <div class="side-foot"><span class="powered">Powered by Cymru Compliance</span></div>
  </aside>
  <div class="sidebar-scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">&#9776;</button>
      <h2 id="page-title"></h2>
      <select id="practice-select" hidden aria-label="Practice"></select>
      <a class="bell" href="#/alerts" id="bell" hidden title="Alerts"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bell-n" id="bell-n" hidden></span></a>
      <div class="lang-toggle" id="lang-toggle">
        <button data-lang="en">EN</button><button data-lang="cy">CY</button>
      </div>
      <a class="user-pill" href="#/settings" id="user-pill" title="Settings"><div class="avatar" id="avatar"></div><div class="who" id="who"></div></a>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>window.CC_BRAND = { name: "Practice Plan", logo: "brand/practiceplan-logo.png", poweredBy: "Powered by Cymru Compliance" };</script>
<script src="../js/site-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/scoring.js"></script>
<script src="js/core.js"></script>
<script src="js/hr-core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-hr.js"></script>
<script src="js/i18n-train.js"></script>
<script src="js/i18n-tools.js"></script>
<script src="js/demo-content.js"></script>
<script src="js/tools-content.js"></script>
<script src="js/audit-content.js"></script>
<script src="js/demo-hr.js"></script>
<script src="js/demo-tools.js"></script>
<script src="js/api-demo.js"></script>
<script src="js/api-supabase.js"></script>
<script src="js/views-dashboard.js"></script>
<script src="js/views-practice.js"></script>
<script src="js/views-group.js"></script>
<script src="js/views-admin.js"></script>
<script src="js/views-hr.js"></script>
<script src="js/views-train.js"></script>
<script src="js/views-tasks.js"></script>
<script src="js/views-compliance.js"></script>
<script src="js/app.js"></script>
</body>
</html>
